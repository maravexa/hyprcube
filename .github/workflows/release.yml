name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag to release
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            rpm \
            zstd

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hyprcube") | .version')
          test "${RELEASE_TAG}" = "v${cargo_version}"

      - name: Build release binary
        run: cargo build --release --locked -p hyprcube

      - name: Install package builders
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build Debian package
        run: cargo deb --no-build -p hyprcube

      - name: Build RPM package
        run: cargo generate-rpm -p crates/hyprcube

      - name: Package portable archive
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          staging="hyprcube-${version}-x86_64-linux"
          archive="${staging}.tar.zst"
          mkdir -p "${staging}"
          cp target/release/hyprcube LICENSE README.md "${staging}/"
          tar --zstd -cf "${archive}" "${staging}"
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Locate native packages
        id: artifacts
        shell: bash
        run: |
          echo "deb=$(find target/debian -name '*.deb' -print -quit)" >> "${GITHUB_OUTPUT}"
          echo "rpm=$(find target/generate-rpm -name '*.rpm' -print -quit)" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.rpm }}
            ${{ env.ARCHIVE }}
